{% load i18n %}{% get_current_language as LANG %}<form method="post" action="{% url 'set_lang' %}" class="lang-switch">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">{% for code, label in LANG_SHORT %}<button type="submit" name="lang" value="{{ code }}" class="{% if code == LANG %}on{% endif %}" {% if code == LANG %}aria-current="true"{% endif %} title="{{ label.1 }}">{{ label.0 }}</button>{% endfor %}</form>
